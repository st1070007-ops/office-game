<title>雙人公司經營模擬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Full-screen HUD: top bar, A console | factory scene | B console, bottom checks. No page scrolling on desktop. */
:root{
  --bg:#E4E9ED; --panel:#FFFFFF; --ink:#14202B; --muted:#586674; --line:#CBD3DA; --track:#DDE3E8;
  --a:#2B5C8A; --a-soft:#E3EDF6; --b:#2F7A52; --b-soft:#E1F1E8;
  --warn:#B3261E; --warn-soft:#F8E1DF; --event:#7A4F00; --event-soft:#F6E8C8; --ok:#2F7A52;
  --sky1:#BFDAEE; --sky2:#EAF3F9; --ground:#8E9AA3; --wall:#D5DCE2; --wall2:#B7C2CB; --roof:#6B7A87; --glass:#9FC3DE; --crate:#B98A52; --crate2:#8C6636;
  --smoke:#FFFFFF; --truck:#2B5C8A; --road:#59656F; --sun:#F6D36B; --city:#9FB0BD;
  --font-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1217; --panel:#16202A; --ink:#E6ECF1; --muted:#97A5B1; --line:#2C3945; --track:#2A3641;
  --a:#7FB2E0; --a-soft:#17293A; --b:#7CC79B; --b-soft:#16301F;
  --warn:#FF8F86; --warn-soft:#3A1E1C; --event:#F0C56A; --event-soft:#3A2E12; --ok:#7CC79B;
  --sky1:#14263A; --sky2:#223A52; --ground:#3A4650; --wall:#34424E; --wall2:#27333D; --roof:#4A5967; --glass:#3F6E8F; --crate:#A87B45; --crate2:#7A5830;
  --smoke:#8FA0AE; --truck:#7FB2E0; --road:#2C363E; --sun:#C9C08A; --city:#3B4B59; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1217; --panel:#16202A; --ink:#E6ECF1; --muted:#97A5B1; --line:#2C3945; --track:#2A3641;
  --a:#7FB2E0; --a-soft:#17293A; --b:#7CC79B; --b-soft:#16301F;
  --warn:#FF8F86; --warn-soft:#3A1E1C; --event:#F0C56A; --event-soft:#3A2E12; --ok:#7CC79B;
  --sky1:#14263A; --sky2:#223A52; --ground:#3A4650; --wall:#34424E; --wall2:#27333D; --roof:#4A5967; --glass:#3F6E8F; --crate:#A87B45; --crate2:#7A5830;
  --smoke:#8FA0AE; --truck:#7FB2E0; --road:#2C363E; --sun:#C9C08A; --city:#3B4B59; color-scheme:dark}
*{box-sizing:border-box}
html{font-size:clamp(13px,1.5vh,17px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.45}
h1{font-size:1.7rem;margin:0;text-wrap:balance} h2{font-size:1.15rem;margin:0} h3{font-size:1rem;margin:0} p{margin:0}
.muted{color:var(--muted)} .num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:700;border:0;border-radius:.4rem;padding:.55rem 1.1rem;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:.3rem .7rem;font-size:.85rem} .btn.big{padding:.75rem 1.2rem;font-size:1.05rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.55rem .75rem}
.notice{font-size:.85rem;color:var(--muted)}
/* HUD grid */
.hud{height:100dvh;display:grid;gap:.6rem;padding:.6rem;padding-left:max(.6rem,env(safe-area-inset-left,0px));padding-right:max(.6rem,env(safe-area-inset-right,0px));
  grid-template-columns:minmax(15rem,19rem) minmax(0,1fr) minmax(15rem,19rem);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "a mid b" "bot bot bot"}
.hud.plain{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top" "scr"}
body{overflow:hidden}
.top{grid-area:top;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.4rem .75rem}
.brand{display:flex;align-items:baseline;gap:.7rem;white-space:nowrap} .brand b{font-size:1.1rem} .brand span{font-size:.9rem;color:var(--muted)}
.strip{display:flex;flex-wrap:wrap;gap:.25rem;flex:1;justify-content:center}
.chip{font-family:var(--font-num);font-size:.75rem;padding:.12rem .5rem;border-radius:.3rem;border:1px solid var(--line);color:var(--muted)}
.chip.done{color:var(--ink);border-color:var(--ink)} .chip.now{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600} .chip.gap{border-style:dashed}
.tools{display:flex;align-items:center;gap:.6rem;margin-left:auto}
.timer{font-family:var(--font-num);font-size:1.1rem}
/* panels */
.pan{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.7rem;overflow:auto;display:flex;flex-direction:column;gap:.55rem;min-height:0;min-width:0}
.role.a{grid-area:a;background:var(--a-soft);border-color:var(--a)} .role.b{grid-area:b;background:var(--b-soft);border-color:var(--b)}
.pan header{display:flex;flex-direction:column;gap:.1rem}
.pan header span{font-size:.8rem;color:var(--muted)}
.role.a h2{color:var(--a)} .role.b h2{color:var(--b)}
.sl{display:flex;flex-direction:column;gap:.7rem}
.srow{display:grid;grid-template-columns:1fr auto;gap:.05rem .5rem;align-items:center}
.srow .nm{font-weight:700;font-size:.92rem}
.srow .nin{display:flex;align-items:center;gap:.25rem}
.srow input[type=range]{grid-column:1/-1;width:100%;margin:.25rem 0 0;accent-color:var(--ink);min-width:0}
.srow input[type=number]{width:4.8rem;font:inherit;font-size:.9rem;font-family:var(--font-num);padding:.2rem .3rem;border-radius:.3rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:right}
.srow .u{font-size:.78rem;color:var(--muted);min-width:1.6rem}
.srow .hint{grid-column:1/-1;font-size:.72rem;color:var(--muted);line-height:1.3}
.confirm{margin-top:auto;position:sticky;bottom:-.7rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.5rem 0 .2rem}
.role.a .confirm{background:linear-gradient(transparent,var(--a-soft) 30%)} .role.b .confirm{background:linear-gradient(transparent,var(--b-soft) 30%)}
.okpill{font-size:.82rem;font-weight:700;padding:.15rem .6rem;border-radius:999px;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.okpill.yes{color:var(--ok);border-color:var(--ok)}
/* centre */
.mid{grid-area:mid;display:flex;flex-direction:column;gap:.5rem;min-height:0;min-width:0}
.banner{display:flex;flex-direction:column;gap:.3rem}
.evl{border-radius:.5rem;padding:.35rem .75rem;background:var(--panel);border:1px solid var(--line);font-size:.9rem}
.evl.hot{background:var(--event-soft);color:var(--event);border-color:transparent;font-weight:500}
.hl{border-radius:.5rem;padding:.4rem .75rem;font-weight:700;background:var(--ink);color:var(--bg);font-size:.95rem}
.hl.bad{background:var(--warn);color:#fff} .hl.good{background:var(--ok);color:#fff}
.prev{font-size:.8rem;color:var(--muted);padding:0 .25rem}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.scene{position:relative;flex:1;min-height:12rem;border-radius:.6rem;overflow:hidden;border:1px solid var(--line);background:linear-gradient(var(--sky1),var(--sky2))}
.scene svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.scene .tick{font-family:var(--font-num);font-size:15px;fill:var(--ink)}
.dusk{position:absolute;inset:0;background:#0A1830;opacity:0;transition:opacity .6s;pointer-events:none}
.scene.night .dusk{opacity:.3}
.cloud{animation:drift 22s ease-in-out infinite alternate;animation-delay:var(--cd,0s)}
@keyframes drift{to{transform:translateX(70px)}}
.smoke circle{fill:var(--smoke);opacity:0;animation:puff 3.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:var(--smk,.7)}100%{opacity:0;transform:translate(34px,-70px) scale(2.2)}}
.gear{transform-box:fill-box;transform-origin:center;animation:spin var(--gspd,6s) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.beltbox{animation:belt var(--bspd,5s) linear infinite;animation-delay:var(--bd,0s)}
@keyframes belt{from{transform:translateX(0)}to{transform:translateX(300px)}}
.worker{animation:bob var(--wd,1.6s) ease-in-out infinite;animation-delay:var(--wdel,0s);transform-box:fill-box}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.worker.tired{animation-duration:3s}
.win{fill:var(--glass);transition:fill .4s}
.night .win{fill:#F6D36B}
.truck{animation:drive 4.2s ease-in-out forwards}
@keyframes drive{0%{transform:translateX(0)}15%{transform:translateX(0)}100%{transform:translateX(700px)}}
.leave{animation:walkout 1.4s .4s ease-in forwards}
@keyframes walkout{to{transform:translateX(70px);opacity:0}}
.arrive{animation:walkin 1.2s .5s ease-out backwards}
@keyframes walkin{from{transform:translateX(-90px);opacity:0}}
/* coach */
.coach{position:absolute;top:.6rem;left:50%;transform:translateX(-50%);width:min(25rem,92%);background:var(--panel);border:2px solid var(--event);border-radius:.6rem;padding:.7rem .85rem;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:3}
.coach .cstep{font-size:.75rem;color:var(--event);font-weight:700} .coach p{font-size:.9rem;margin:.2rem 0 .5rem} .coach .cbtn{display:flex;gap:.4rem;align-items:center}
.spot{outline:3px solid var(--event);outline-offset:3px;animation:pulse 1.2s ease-in-out infinite;position:relative;z-index:2}
@keyframes pulse{50%{outline-color:transparent}}
/* kpis */
.k{background:var(--panel);border:1px solid var(--line);border-radius:.5rem;padding:.3rem .5rem;display:flex;flex-direction:column;gap:.05rem;min-width:0}
.k .l{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .k .v{font-family:var(--font-num);font-size:1.05rem;font-weight:600;line-height:1.15}
.bar{height:.3rem;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .6s}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem} .kgrid .k .v{font-size:1.2rem}
/* bottom checks */
.bot{grid-area:bot;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(11rem,14rem);gap:.6rem;align-items:stretch}
.bot.res{grid-template-columns:minmax(0,1fr) minmax(11rem,14rem)}
.chk{display:flex;flex-direction:column;gap:.2rem}
.chk .row{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline;font-size:.9rem}
.track{position:relative;height:1.05rem;border-radius:.35rem;background:var(--track);margin-top:1.1rem}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:.35rem 0 0 .35rem;max-width:100%;background:var(--a);transition:width .5s cubic-bezier(.3,.7,.2,1),background .3s}
.fill.over{background:var(--warn)}
.stack{position:absolute;left:0;top:0;bottom:0;display:flex;width:0;border-radius:.35rem 0 0 .35rem;overflow:hidden;transition:width .5s cubic-bezier(.3,.7,.2,1)}
.stack i{display:block;height:100%;min-width:0}
.mark{position:absolute;top:-.2rem;bottom:-.2rem;width:3px;background:var(--ink);transition:left .5s cubic-bezier(.3,.7,.2,1)}
.mark span{position:absolute;top:-1.05rem;left:-2px;font-size:.68rem;font-family:var(--font-num);white-space:nowrap}
.mark.r span{left:auto;right:-1px;text-align:right}
.mt{font-size:.75rem;color:var(--muted);line-height:1.3}
.legend{display:flex;flex-wrap:wrap;gap:.1rem .6rem;font-size:.7rem;color:var(--muted)}
.legend b.sw{display:inline-block;width:.6rem;height:.6rem;border-radius:2px;margin-right:.25rem}
.status{font-weight:700;font-size:.85rem} .status.bad{color:var(--warn)} .status.good{color:var(--ok)}
.sub{display:flex;flex-direction:column;justify-content:center;gap:.4rem;text-align:center}
/* screens */
.screen{grid-area:scr;display:flex;align-items:center;justify-content:center;min-height:0;overflow:auto}
.sheet{width:min(46rem,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:1.4rem 1.6rem;display:flex;flex-direction:column;gap:.9rem}
.sheet.wide{width:min(64rem,100%)}
.dots{display:flex;gap:.4rem;align-items:center} .dots i{width:.6rem;height:.6rem;border-radius:50%;background:var(--track)} .dots i.on{background:var(--ink)}
.navrow{display:flex;gap:.6rem;align-items:center;justify-content:space-between}
ul.plain,ol.plain{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.35rem}
.mini{display:grid;grid-template-columns:1fr 2fr 1fr;gap:.4rem;font-size:.85rem;text-align:center}
.mini div{border-radius:.4rem;padding:.7rem .4rem;border:1px solid var(--line)}
.mini .a{background:var(--a-soft);border-color:var(--a);color:var(--a)} .mini .b{background:var(--b-soft);border-color:var(--b);color:var(--b)}
.mini .m{background:linear-gradient(var(--sky1),var(--sky2))} .mini .bt{grid-column:1/-1;background:var(--panel)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{padding:.3rem .45rem;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left} th{color:var(--muted);font-weight:500}
.viol{color:var(--warn);font-weight:700}
textarea{width:100%;min-height:10rem;font-family:var(--font-num);font-size:.75rem;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:.4rem;padding:.6rem}
@media (prefers-reduced-motion:reduce){.smoke circle,.gear,.beltbox,.worker,.truck,.leave,.arrive,.cloud,.spot,.shake{animation:none}.leave{opacity:.2}.truck{transform:translateX(700px)}.fill,.stack,.mark,.bar i,.dusk{transition:none}}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{font:inherit;text-align:left;padding:.7rem 1rem;border-radius:.5rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.opt.sel,.sc.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pair{display:flex;align-items:stretch;gap:.7rem}
.cc{flex:1;border:1px solid var(--line);border-radius:.6rem;padding:.8rem 1rem;display:flex;flex-direction:column;gap:.2rem;background:var(--bg)}
.cc b{font-size:1.2rem} .cc span{font-size:.85rem;color:var(--muted)} .arrow{align-self:center;font-size:1.4rem;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(9,1fr);gap:.3rem}
.sc{font:inherit;font-family:var(--font-num);font-weight:600;padding:.7rem 0;border-radius:.4rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.ends{display:flex;justify-content:space-between;gap:.5rem;font-size:.78rem;color:var(--muted)} .ends span:nth-child(2){text-align:center}
.tcode{display:flex;align-items:baseline;gap:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:.6rem;padding:.6rem 1rem} .tcode b{font-size:2rem;letter-spacing:.15em}
.chks{display:flex;flex-wrap:wrap;gap:1.2rem;align-items:center} .chks label{display:flex;gap:.4rem;align-items:center;cursor:pointer}
.sheet a{color:var(--a);word-break:break-all}
.kstrip,.fstrip{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:.35rem;align-items:stretch}
.kt{writing-mode:vertical-rl;font-size:.7rem;font-weight:700;color:var(--muted);align-self:center;letter-spacing:.1em;text-align:center}
.fstrip .k{border-color:var(--ink)} .fstrip .k .v{font-size:1.1rem}
.mission{border-radius:.5rem;padding:.4rem .75rem;background:var(--panel);border:2px solid var(--ink);font-size:.98rem}
.ti{display:inline-flex;align-items:center;justify-content:center;width:1.05rem;height:1.05rem;margin-left:.25rem;border-radius:50%;border:1px solid var(--muted);background:var(--panel);color:var(--muted);font:700 .68rem/1 var(--font-ui,inherit);cursor:pointer;padding:0;vertical-align:middle;flex:none}
.ti:hover,.ti:focus-visible{background:var(--ink);color:var(--panel);border-color:var(--ink);outline:none}
.tipbox{position:fixed;z-index:30;max-width:min(300px,calc(100vw - 16px));background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:.6rem;padding:.6rem .75rem;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:.85rem;line-height:1.45}
.tipbox b{display:block;margin-bottom:.15rem}.tipbox p{margin:0 0 .4rem}
.tipbox .tl{background:none;border:0;padding:0;color:var(--muted);font-size:.75rem;text-decoration:underline;cursor:pointer}
.intel{border:1.5px dashed var(--muted);border-radius:.5rem;padding:.35rem .5rem;display:flex;flex-direction:column;gap:.3rem;flex:none}
.ibtn{display:flex;align-items:center;gap:.4rem;width:100%;background:var(--panel);border:1px solid var(--ink);border-radius:.4rem;padding:.3rem .5rem;font:600 .82rem/1.2 inherit;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.ibtn small{margin-left:auto;color:var(--muted);font-weight:400;font-size:.7rem}
.ibtn.on{background:var(--ink);color:var(--panel)} .ibtn.on small{color:inherit}
.itxt{font-size:.82rem;line-height:1.45}
#netbar{position:fixed;left:50%;bottom:.5rem;transform:translateX(-50%);z-index:25;background:var(--ink);color:var(--panel);padding:.3rem .8rem;border-radius:2rem;font-size:.78rem;max-width:92vw;text-align:center;opacity:.92}

.intel .ihead{font-weight:600;font-size:.82rem;display:flex;gap:.4rem;align-items:center}.intel .ihead small{margin-left:auto;color:var(--muted);font-weight:400;font-size:.7rem}
.intel.mine{border-style:solid;border-color:var(--ink)}.intel .ifoot{font-size:.72rem;color:var(--muted)}
.opts .opt{display:block;width:100%;text-align:left;margin:.4rem 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
.ov .sheet{max-height:92vh}
dl.gl{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1rem;margin:0;font-size:.92rem} dl.gl dt{font-weight:700} dl.gl dd{margin:0;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem} .steps div{border:1px solid var(--line);border-radius:.5rem;padding:.5rem .6rem;display:flex;flex-direction:column;gap:.2rem;font-size:.88rem} .steps b{font-size:1.2rem;color:var(--a)} .steps span{font-size:.78rem;color:var(--muted)}
@media (max-width:700px){.k .l{white-space:normal;overflow:visible;text-overflow:clip}.steps{grid-template-columns:1fr}dl.gl{grid-template-columns:1fr}.kt{writing-mode:horizontal-tb;grid-column:1/-1}}

@media (max-width:1000px){

<script>
/* ================= constants (provisional; calibrate offline) ================= */
var COMPANY='OO製造';
var START={N:30,sk:5,en:5,mach:80,mat:300};
var SEQ=[
 {id:'P1',label:'P1',practice:true},{id:'P2',label:'P2',practice:true},
 {id:'R1',label:'R1'},{id:'R2',label:'R2'},{id:'R3',label:'R3'},{id:'R4',label:'R4'},
 {id:'T2',label:'T2',smm:true},
 {id:'R5',label:'R5'},{id:'R6',label:'R6'},{id:'R7',label:'R7'},{id:'R8',label:'R8'}
];
var SELL=33;            /* selling price per good unit */
var TARGETS={P1:400,P2:400,R1:400,R2:430,R3:460,R4:490,R5:540,R6:570,R7:600,R8:630};

/* ================= model ================= */
function clamp(x,a,b){return Math.min(b,Math.max(a,x))}
function matOf(s,ev){return ev.fire?0:s.mat}
function VAL(m,sk,en){return 60*m+1200*sk+2500*en}
function mach0(s,ev){return clamp(s.mach+ev.mach,0,100)}
function effM(s,d,ev){return clamp(mach0(s,ev)+(d.maint-600)/50,0,100)}
function effEn(s,d,ev){var w=d.wage-ev.wmkt;return clamp(s.en+0.7*(0.05*clamp(w-100,-30,20)+0.015*Math.min(d.ben/s.N-20,20)+0.004*Math.min(d.train/s.N-33,60)),1,10)}
function busy(s,d){return 1-Math.max(0,d.maint-600)/20000-Math.max(0,d.train/s.N-33)/1000}
function newLoss(s,d){return (s.nw||0)*(d.train/s.N>=40?0.25:0.5)}
function capOf(s,d,ev){
  var m=effM(s,d,ev),en=effEn(s,d,ev),Ne=s.N-0.5*s.N*turnOf(s,d,ev);
  return Math.max(1,Ne-newLoss(s,d))*17*(0.75+0.05*s.sk)*(0.8+0.04*en)*(0.5+0.5*m/100)*(1+0.8*d.ot/100)*busy(s,d)*ev.cap;
}
function turnOf(s,d,ev){return clamp(0.12-0.011*s.en-0.0035*(d.wage-ev.wmkt-100)+ev.turn+0.015*Math.max(0,d.ot-10),0.02,0.35)}
function evalDec(s,d,ev){
  var cap=capOf(s,d,ev),avail=matOf(s,ev)+d.buy,qty=Math.min(d.plan,cap,avail);
  var tr=turnOf(s,d,ev),left=Math.round(s.N*tr),mat2=avail-qty;
  var pay=s.N*150*d.wage/100;
  var c={
    pay:pay+pay*d.ot/100*1.5, mat:d.buy*ev.price+mat2, train:d.train, ben:d.ben, maint:d.maint, insp:d.insp*10,
    move:d.rec*250+d.lay*400+left*150
  };
  c.total=c.pay+c.mat+c.train+c.ben+c.maint+c.insp+c.move;
  return {cap:cap,avail:avail,qty:qty,tr:tr,left:left,mat2:mat2,cost:c};
}
function check(s,d,ev){
  var e=evalDec(s,d,ev),m=[];
  if(d.plan>e.cap+1e-9)m.push('生產計畫超過目前產能。');
  if(d.plan>e.avail+1e-9)m.push('原料不足：生產計畫超過現有庫存加本回合採購量。');
  return m;
}
function advance(s,d,ev,noShock){
  var e=evalDec(s,d,ev),m=mach0(s,ev),load=e.cap>0?e.qty/e.cap:1,me=effM(s,d,ev);
  var defect=clamp(0.18-0.0012*d.insp-0.006*(s.sk-5)+0.002*d.ot+0.0008*(100-me)+(noShock?0:ev.dshock),0.02,0.35);
  var good=e.qty*(1-defect);
  var sold=Math.min(Math.round(good),ev.target),revenue=sold*SELL;
  var p=d.train/s.N,b=d.ben/s.N;
  var en2=clamp(s.en+0.05*clamp(d.wage-ev.wmkt-100,-30,20)+0.015*Math.min(b-20,20)+0.004*Math.min(p-33,60)-0.05*d.ot-0.1*Math.max(0,d.ot-10)-0.35*d.lay-3*Math.max(0,load-0.9)-0.12*(s.en-5),1,10);
  var stay=Math.max(0,s.N-e.left-d.lay),N2=Math.max(1,stay+d.rec);
  var sk2=clamp(((s.sk+0.012*Math.min(p-33,60))*stay+3*d.rec)/N2,1,10);
  var m2=clamp(m-4-10*load+d.maint/60,0,100);
  var dV=VAL(m2,sk2,en2)-VAL(mach0(s,ev),s.sk,s.en),profit=revenue-e.cost.total+dV,passed=Math.round(good)>=ev.target&&profit>=0;
  return {
    next:{N:N2,sk:sk2,en:en2,mach:m2,mat:e.mat2,nw:d.rec},
    out:{revenue:revenue,dV:dV,profit:profit,passed:passed,cap:e.cap,qty:e.qty,good:good,defect:defect,ach:good/ev.target,cost:e.cost.total,unit:e.cost.total/Math.max(good,1),tr:e.tr,left:e.left,en:en2,sk:sk2,N:N2,mach:m2,mat:e.mat2}
  };
}

  document.querySelectorAll('input[type=number]').forEach(function(el){
    el.oninput=function(){var k=el.getAttribute('data-k');if(el.value!==''){var v=snap(k,el.value);S.dec[k]=v;$('r-'+k).value=v;touch(k);refreshLive()}};
    el.onchange=function(){var k=el.getAttribute('data-k');onChange(k,el.value);logEv('change_typed',{field:k})};
  });
}
function beginRound(){
  S.screen='play';S.dec=freshDec();S.confA=false;S.confB=false;S.errors=[];S.roundStart=Date.now();S.curViol=0;S.tFirst=null;
  if(S.idx===0&&!S.tourSeen){S.tour=0;S.tourSeen=true}else S.tour=-1;
  logEv('round_start',{state:Object.assign({},S.state)});render();
}
function submit(){
  var r=cur(),ev=roundInfo(r.id),msgs=check(S.state,S.dec,ev);
  if(msgs.length){
    S.errors=msgs;if(!r.practice)S.violations++;S.curViol++;S.confA=false;S.confB=false;
    logEv('rejected',{reasons:msgs,dec:Object.assign({},S.dec)});refreshLive();
    var bn=$('banner');if(bn&&!reduce){bn.classList.remove('shake');void bn.offsetWidth;bn.classList.add('shake')}return;
  }
  var res=advance(S.state,S.dec,ev);
  var tSub=Date.now()-S.roundStart;logEv('submitted',{t_first_confirm:S.tFirst,t_submit:tSub,dec:Object.assign({},S.dec),out:res.out,state_before:Object.assign({},S.state)});
  if(!r.practice)S.history.push({id:r.id,good:res.out.good,ach:res.out.ach,unit:res.out.unit,revenue:res.out.revenue,profit:res.out.profit,passed:res.out.passed,en:res.out.en,tr:res.out.tr,N:res.out.N,viol:S.curViol,t1:S.tFirst,t2:tSub,dec:Object.assign({},S.dec)});
  S.stateBefore=Object.assign({},S.state);S.lastTarget=ev.target;S.lastRec=S.dec.rec;S.lastLay=S.dec.lay;
  S.last=res.out;S.lastId=r.id+(r.practice?'（練習）':'');S.state=res.next;S.screen='result';render();
}
function nextRound(){
  var r=cur();
  if(r.id==='P2'){S.state=Object.assign({},START);S.last=null}
  S.idx++;
  if(S.idx>=SEQ.length){S.screen='end';logEv('game_end');render();return}
  if(cur().smm){S.screen='smm';S.smm=newSmm();logEv('smm_start',{team_code:S.teamCode});render();return}
  beginRound();
}

/* ================= 雙電腦連線（WebRTC 直連，不經任何伺服器）================= */
var NET=null,REMOTE=false,_pair={mode:'',step:'',offer:'',answer:'',msg:'',err:''},_pc=null,_dc=null;
var ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}];
function b64e(u8){var s='';for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(t){t=t.replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var s=atob(t),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function pipe(u8,Ctor){var st=new Blob([u8]).stream().pipeThrough(new Ctor('deflate-raw'));return new Uint8Array(await new Response(st).arrayBuffer())}
async function encCode(obj){var raw=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream!=='undefined')return 'Z'+b64e(await pipe(raw,CompressionStream));return 'R'+b64e(raw)}
async function decCode(t){t=t.trim();var k=t.charAt(0),u=b64d(t.slice(1));
  if(k==='Z'){if(typeof DecompressionStream==='undefined')throw new Error('nodecomp');u=await pipe(u,DecompressionStream)}
  return JSON.parse(new TextDecoder().decode(u))}
function gathered(pc){return new Promise(function(res){if(pc.iceGatheringState==='complete')return res();
  var t=setTimeout(res,6000);pc.addEventListener('icegatheringstatechange',function(){if(pc.iceGatheringState==='complete'){clearTimeout(t);res()}})})}
function newPc(){
  _pc=new RTCPeerConnection({iceServers:ICE});
  _pc.onconnectionstatechange=function(){var s=_pc.connectionState;if(NET&&(s==='disconnected'||s==='failed'||s==='closed'))netBar('連線中斷：請確認雙方網路。若已斷線，請兩邊重新整理後重新配對（目前進度無法接續）。',true)};
  return _pc}
function sendMsg(o){if(_dc&&_dc.readyState==='open')try{_dc.send(JSON.stringify(o))}catch(e){}}
function netBar(t,bad){var b=document.getElementById('netbar');if(!b){b=document.createElement('div');b.id='netbar';b.setAttribute('role','status');document.body.appendChild(b)}b.textContent=t;b.className=bad?'bad':'';b.style.display=t?'block':'none'}
function setupChannel(ch,role){
  _dc=ch;
  ch.onopen=function(){NET={role:role};
    netBar('已連線：你是成員 '+role+'（'+(role==='A'?'營運':'人資')+'）');
    if(role==='A')sendMsg({t:'hello',code:S.teamCode});
    S.screen='intro';S.ip=0;render()};
  ch.onclose=function(){if(NET)netBar('連線中斷：請兩邊重新整理後重新配對（目前進度無法接續）。',true)};
  ch.onmessage=function(ev){var m;try{m=JSON.parse(ev.data)}catch(e){return}onNetMsg(m)}}
async function hostCreate(){
  _pair.err='';_pair.msg='正在產生邀請碼…（最多約 6 秒）';render();
  try{var pc=newPc();setupChannel(pc.createDataChannel('g'),'A');
    await pc.setLocalDescription(await pc.createOffer());await gathered(pc);
    _pair.offer=await encCode({d:pc.localDescription});_pair.msg='';_pair.step='hostWait'}
  catch(e){_pair.err='無法建立連線：'+(e&&e.message||e)}
  render()}
async function hostAccept(txt){
  _pair.err='';
  try{var a=await decCode(txt);await _pc.setRemoteDescription(a.d);_pair.msg='已送出回覆碼，連線中…若 20 秒內沒有連上，可能是網路阻擋，請見下方說明。';render()}
  catch(e){_pair.err='回覆碼無法讀取，請確認完整複製（含最前面的英文字母）。';render()}}
async function guestJoin(txt){
  _pair.err='';_pair.msg='正在產生回覆碼…（最多約 6 秒）';render();
  try{var o=await decCode(txt);var pc=newPc();pc.ondatachannel=function(e){setupChannel(e.channel,'B')};
    await pc.setRemoteDescription(o.d);await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);
    _pair.answer=await encCode({d:pc.localDescription});_pair.msg='';_pair.step='guestWait'}
  catch(e){_pair.err='邀請碼無法讀取，請確認完整複製（含最前面的英文字母）。'}
  render()}
function viewPair(){
  var p=_pair,h='<div class="hud plain">'+topbar(false)+'<div class="screen"><div class="sheet"><h1>連線方式</h1>';
  if(!p.mode){
    h+='<p>請決定這一局怎麼玩：</p><div class="opts"><button class="opt" id="pHost"><b>兩台電腦，我是成員 A（營運）</b><br><span class="muted">由 A 建立房間，產生邀請碼給 B</span></button><button class="opt" id="pGuest"><b>兩台電腦，我是成員 B（人資）</b><br><span class="muted">貼上 A 給你的邀請碼</span></button><button class="opt" id="pSolo"><b>兩人共用同一台電腦</b><br><span class="muted">不需要連線</span></button></div><p class="notice">兩台電腦模式：每人只看得到自己的「部門情報」，兩邊的拉桿與結果即時同步。連線用瀏覽器直連，資料不會經過伺服器。兩人需要同時保持頁面開啟，中途重新整理會斷線且無法接續。</p>';
  }else if(p.mode==='host'){
    if(p.step!=='hostWait'){h+='<h2>成員 A：建立房間</h2><p>按下按鈕後會產生一段「邀請碼」。</p><button class="btn" id="hGen"'+(p.msg?' disabled':'')+'>產生邀請碼</button>'}
    else h+='<h2>成員 A：建立房間</h2><ol class="plain"><li>把下面的<b>邀請碼</b>整段複製，用訊息傳給成員 B。<textarea id="offer" readonly rows="4">'+esc(p.offer)+'</textarea><button class="btn ghost" id="cpOffer">複製邀請碼</button> <span class="notice" id="cpd1"></span></li><li>B 會傳回一段<b>回覆碼</b>，貼在這裡：<textarea id="ans" rows="4" placeholder="貼上成員 B 的回覆碼"></textarea><button class="btn" id="hAcc">連線</button></li></ol>';
  }else{
    if(p.step!=='guestWait')h+='<h2>成員 B：加入房間</h2><p>請貼上成員 A 傳給你的<b>邀請碼</b>：</p><textarea id="inv" rows="4" placeholder="貼上成員 A 的邀請碼"></textarea><button class="btn" id="gGo"'+(p.msg?' disabled':'')+'>產生回覆碼</button>';
    else h+='<h2>成員 B：加入房間</h2><p>請把下面的<b>回覆碼</b>整段複製，傳給成員 A，並等 A 按下「連線」。</p><textarea id="answer" readonly rows="4">'+esc(p.answer)+'</textarea><button class="btn ghost" id="cpAns">複製回覆碼</button> <span class="notice" id="cpd2"></span><p class="notice">連上後畫面會自動進入遊戲。</p>';
  }
  if(p.msg)h+='<p class="notice">'+p.msg+'</p>';
  if(p.err)h+='<div class="err" role="alert">'+p.err+'</div>';
  if(p.mode)h+='<p class="notice">連不上時：①兩人先試試換成同一個 Wi-Fi 或手機熱點；②學校網路可能擋住直連，可改用「兩人共用同一台電腦」。</p><div class="navrow"><button class="btn ghost" id="pBack">返回</button><span></span></div>';
  return h+'</div></div></div>'}
function copyFrom(id,msgId){var t=document.getElementById(id);t.select();var ok=function(m){document.getElementById(msgId).textContent=m};
  try{navigator.clipboard.writeText(t.value).then(function(){ok('已複製')},function(){try{document.execCommand('copy')}catch(e){}ok('已選取，請按 Ctrl+C 複製')})}catch(e){try{document.execCommand('copy')}catch(e2){}ok('已選取，請按 Ctrl+C 複製')}}
function bindPair(){
  var q=function(i){return document.getElementById(i)};
  if(q('pHost'))q('pHost').onclick=function(){_pair.mode='host';_pair.step='';render()};
  if(q('pGuest'))q('pGuest').onclick=function(){_pair.mode='guest';_pair.step='';render()};
  if(q('pSolo'))q('pSolo').onclick=function(){NET=null;S.screen='intro';render()};
  if(q('pBack'))q('pBack').onclick=function(){try{if(_pc)_pc.close()}catch(e){};_pc=null;_dc=null;_pair={mode:'',step:'',offer:'',answer:'',msg:'',err:''};render()};
  if(q('hGen'))q('hGen').onclick=hostCreate;
  if(q('hAcc'))q('hAcc').onclick=function(){hostAccept(q('ans').value)};
  if(q('gGo'))q('gGo').onclick=function(){guestJoin(q('inv').value)};
  if(q('cpOffer'))q('cpOffer').onclick=function(){copyFrom('offer','cpd1')};
  if(q('cpAns'))q('cpAns').onclick=function(){copyFrom('answer','cpd2')};
}
/* ---------- 訊息同步 ---------- */
function onNetMsg(m){
  REMOTE=true;
  try{
    if(m.t==='hello'){S.teamCode=m.code;render()}
    else if(m.t==='ip'){if(S.screen==='intro'){S.ip=m.ip;NET.sentIp=m.ip;render()}}
    else if(m.t==='start'){if(S.screen==='intro')beginRound()}
    else if(m.t==='dec'){if(S.screen==='play'&&S.idx===m.idx&&CTL[m.k]){S.dec[m.k]=snap(m.k,m.v);var r=$('r-'+m.k),n=$('n-'+m.k);if(r)r.value=S.dec[m.k];if(n)n.value=S.dec[m.k];S.errors=[];if(CTL[m.k].who==='A')S.confA=false;else S.confB=false;refreshLive()}}
    else if(m.t==='conf'){if(S.screen==='play'&&S.idx===m.idx){if(m.who==='A')S.confA=m.on;else S.confB=m.on;S.errors=[];refreshLive()}}
    else if(m.t==='submit'){if(S.screen==='play'&&S.idx===m.idx)submit()}
    else if(m.t==='next'){if(S.screen==='result'&&S.idx===m.idx)nextRound()}
    else if(m.t==='smm'){if(S.screen==='smm'&&S.smm){S.smm['done'+m.who]=true;smmCheck();if(S.screen==='smm')render()}}
  }finally{REMOTE=false}}
function smmCheck(){var m=S.smm;if(m&&m.doneA&&m.doneB){logEv('smm_done');S.idx++;beginRound()}}
/* ---------- 包裝既有函式 ---------- */
var _logEv=logEv;logEv=function(type,data){_logEv(type,data);
  if(!NET||REMOTE)return;
  if(type==='change')sendMsg({t:'dec',idx:S.idx,k:data.field,v:data.value});
  else if(type==='confirm')sendMsg({t:'conf',idx:S.idx,who:data.who,on:data.on})};
var _submit=submit;submit=function(){if(NET&&!REMOTE)sendMsg({t:'submit',idx:S.idx});_submit()};
var _next=nextRound;nextRound=function(){if(NET&&!REMOTE)sendMsg({t:'next',idx:S.idx});_next()};
var _begin=beginRound;beginRound=function(){if(NET&&!REMOTE&&S.screen==='intro')sendMsg({t:'start'});_begin()};
var _viewIntro=viewIntro;
var _render=render;render=function(){
  if(S.screen==='pair'){document.getElementById('app').innerHTML=viewPair();bindPair();return}
  _render();
  if(NET&&S.screen==='intro'&&NET.sentIp!==S.ip){NET.sentIp=S.ip;if(!REMOTE)sendMsg({t:'ip',ip:S.ip})}
  if(NET&&S.screen==='play')netLock();
  if(NET&&S.screen==='smm')bindNetSmm()};
function netLock(){
  if(!NET)return;var other=NET.role==='A'?'B':'A',ord=other==='A'?ORDER_A:ORDER_B;
  ord.forEach(function(k){var r=$('r-'+k),n=$('n-'+k);if(r)r.disabled=true;if(n)n.disabled=true});
  var b=$('c'+other);if(b){b.disabled=true;b.title='這是成員 '+other+' 的確認鍵'}}
var _rl=refreshLive;refreshLive=function(){_rl();netLock()};
var _intelBox=intelBox;intelBox=function(w){
  if(!NET)return _intelBox(w);
  var id=cur().id,it=INTEL[id];if(!it)return '';
  if(w===NET.role)return '<div class="intel mine"><div class="ihead">🔒 你的部門情報（只有你看得到）</div><div class="itxt">'+it[w]+'</div><div class="ifoot">請口頭告訴搭檔，再一起決定。</div></div>';
  return '<div class="intel"><div class="ihead">🔒 成員 '+w+' 的部門情報<small>只有對方看得到</small></div><div class="itxt muted">想知道內容，請詢問對方。</div></div>'};
var _viewSMM=viewSMM;viewSMM=function(){
  if(!NET)return _viewSMM();
  var m=S.smm,me=NET.role,mine=m['done'+me],o=me==='A'?'B':'A';
  return '<div class="hud plain">'+topbar(false)+'<div class="screen"><div class="sheet"><h2>T2　請完成問卷</h2><p>遊戲暫停。請<b>各自在自己的電腦上</b>開啟問卷，同時作答。作答期間不要討論，也不要看對方的螢幕。</p>'+
  '<div class="tcode"><span>團隊代碼</span><b class="num">'+S.teamCode+'</b></div>'+
  '<ol class="plain"><li>開啟問卷頁面：<a href="'+QURL+'" target="_blank" rel="noopener noreferrer">'+QURL+'</a></li><li>輸入上面的團隊代碼，並選擇自己的角色（你是成員 '+me+'）。</li><li>完成 81 題（約 15–20 分鐘），把作答紀錄交給研究者。</li><li>完成後，回到這個畫面按下「我完成了」。兩人都按了，遊戲才會繼續。</li></ol>'+
  '<div class="chks"><span class="muted">狀態：</span><span>成員 '+me+'（你）：'+(mine?'已完成':'作答中')+'</span><span>成員 '+o+'：'+(m['done'+o]?'已完成':'作答中')+'</span></div>'+
  '<div><button class="btn" id="netSmmDone"'+(mine?' disabled':'')+'>我完成了</button></div></div></div></div>'};
function bindNetSmm(){var b=$('netSmmDone');if(b)b.onclick=function(){S.smm['done'+NET.role]=true;logEv('smm_check',{who:NET.role,done:true});sendMsg({t:'smm',who:NET.role});smmCheck();if(S.screen==='smm')render()}}
var _init2=init;init=function(){_init2();S.screen=NET?'intro':'pair'};
S.screen='pair';
render();
</script>
