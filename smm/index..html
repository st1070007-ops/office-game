<style>

<script>
var TASKC=[['薪資水準','薪資的高低'],['培訓投入','培訓的投入量'],['加班','加班的多寡'],['員工技能','員工的技能水準'],['員工投入度','員工的投入程度'],['離職率','每回合離職比例'],['產能（生產力）','最多能生產的量'],['生產目標達成','產量相對目標的比例'],['單位生產成本','每單位的生產成本']];
var TEAMC=[['資訊分享','主動把自己知道的資訊告訴搭檔'],['意見徵詢','做決定前先問搭檔的想法'],['坦誠表達','可以直接說出不同意的看法'],['協調配合','兩人的決定互相搭配'],['信任','相信搭檔的判斷和意圖'],['決策速度','很快就做出決定']];
var ROLES=['成員 A（營運）','成員 B（人資）','兩人共同決定'];
var CHK=[
 {q:'生產計畫超過目前產能時，提交會發生什麼事？',o:['照產能出貨，不受影響','被系統退回，需修改後重新確認','系統自動調降計畫並提交'],a:1},
 {q:'其他條件相同，提高薪資水準，員工離職傾向通常會？',o:['上升','下降','不受影響'],a:1},
 {q:'其他條件相同，增加加班，本回合的產能會？',o:['上升','下降','不變'],a:0},
 {q:'實際產量取下列哪三者中的最小值？',o:['生產計畫、產能、可用原料','訂單目標、預算、員工人數','產能、薪資、機器狀態'],a:0}
];
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function pairs(n){var a=[];for(var i=0;i<n;i++)for(var j=i+1;j<n;j++)a.push([i,j]);return a}
var KEY='t2smm_draft_v3';
var P={screen:'setup',team:'',role:'',items:[],idx:0,data:{task:{},team:{},role:{},dep:{},scn:{},chk:{},basis:{}},rt:{},swap:{},t0:0,tStart:0,tEnd:0,code:'',merge:null,err:''};
var LEV={plan:'生產計畫',buy:'原料採購',ot:'加班',maint:'設備維護預算',insp:'品質檢驗強度',wage:'薪資水準',train:'培訓預算',ben:'福利與團隊活動',rec:'招募人數',lay:'資遣人數'};
var OWN={plan:0,buy:0,ot:0,maint:0,insp:0,wage:1,train:1,ben:1,rec:1,lay:1};
var DEP=[
 {q:'A 的加班太多，會使 B 負責的員工離職率上升。',a:0},
 {q:'B 招募的新進員工，會影響 A 在設定生產計畫時的產能上限。',a:0},
 {q:'B 的培訓預算花得越多，A 這一季可用來生產的時間越少。',a:0},
 {q:'B 調高薪資只會增加人事成本，和 A 的生產計畫無關。',a:1}
];
var SCN=[
 {t:'競爭者來挖角，員工的離職傾向明顯上升。',A:'plan',B:'wage'},
 {t:'原料價格大幅上漲（每單位 6 → 10）。',A:'buy',B:'train'},
 {t:'大型訂單進來，下一季訂單明顯增加。',A:'ot',B:'rec'},
 {t:'工廠失火，原料庫存全毀、機器受損。',A:'maint',B:'ben'},
 {t:'流感季來了，出勤預計下降。',A:'buy',B:'ben'},
 {t:'員工投入度偏低，士氣不高。',A:'ot',B:'wage'}
];
var DIR=['增加','維持不變','減少'];
function other(r){return r==='A'?'B':'A'}
function save(){try{localStorage.setItem(KEY,JSON.stringify({screen:P.screen==='merge'?'setup':P.screen,team:P.team,role:P.role,items:P.items,idx:P.idx,data:P.data,rt:P.rt,swap:P.swap,tStart:P.tStart,tEnd:P.tEnd,code:P.code}))}catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.screen&&s.screen!=='setup'){for(var k in s)P[k]=s[k]}}catch(e){}}
function itKey(it){return it.k==='basis'?it.b:it.k==='chk'?String(it.q):it.k==='role'?it.l:it.k==='dep'?'d'+it.q:it.k==='scn'?it.s+'-'+it.w:it.i+'-'+it.j}
function buildItems(){
  var it=[];shuf(pairs(9)).forEach(function(p){it.push({k:'task',i:p[0],j:p[1]})});
  shuf(pairs(6)).forEach(function(p){it.push({k:'team',i:p[0],j:p[1]})});
  shuf(Object.keys(LEV)).forEach(function(l){it.push({k:'role',l:l})});
  shuf(DEP.map(function(_,q){return q})).forEach(function(q){it.push({k:'dep',q:q})});
  shuf(SCN.map(function(_,s){return s})).forEach(function(q){it.push({k:'scn',s:q,w:'own'});it.push({k:'scn',s:q,w:'pred'})});
  it.push({k:'basis',b:'task'});it.push({k:'basis',b:'team'});
  CHK.forEach(function(c,q){it.push({k:'chk',q:q})});return it;
}
function pearson(x,y){var n=x.length,mx=0,my=0,i;for(i=0;i<n;i++){mx+=x[i];my+=y[i]}mx/=n;my/=n;var sxy=0,sxx=0,syy=0;for(i=0;i<n;i++){var dx=x[i]-mx,dy=y[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy}return sxx>0&&syy>0?sxy/Math.sqrt(sxx*syy):null}
function qap(a,b,n){
  var pr=pairs(n),x=pr.map(function(p){return a[p[0]+'-'+p[1]]}),B=[],i,j;
  for(i=0;i<n;i++){B.push(new Array(n).fill(0))}
  pr.forEach(function(p){B[p[0]][p[1]]=B[p[1]][p[0]]=b[p[0]+'-'+p[1]]});
  var y=new Array(pr.length),perm=[];for(i=0;i<n;i++)perm.push(i);
  function yv(){for(var k=0;k<pr.length;k++)y[k]=B[perm[pr[k][0]]][perm[pr[k][1]]];return pearson(x,y)}
  var obs=yv();if(obs==null)return {r:null,sim:null,p:null,perms:0};
  var tot=0,ge=0;function ev(){var r=yv();if(r!=null){tot++;if(r>=obs-1e-12)ge++}}
  var c=new Array(n).fill(0);ev();i=0;
  while(i<n){if(c[i]<i){var t;if(i%2===0){t=perm[0];perm[0]=perm[i];perm[i]=t}else{t=perm[c[i]];perm[c[i]]=perm[i];perm[i]=t}ev();c[i]++;i=0}else{c[i]=0;i++}}
  return {r:obs,sim:(obs+1)/2,p:ge/tot,perms:tot};
}
function sec(it){return it.k==='task'?['Task MM',0,36]:it.k==='team'?['Team Interaction MM・合作方式',36,15]:it.k==='role'?['Team Interaction MM・職能知識',51,10]:it.k==='dep'?['Team Interaction MM・職能知識',61,4]:it.k==='scn'?['Team Interaction MM・決策預測',65,12]:it.k==='basis'?['作答依據',77,2]:['規則檢核',79,CHK.length]}
function view(){
  if(P.screen==='setup')return vSetup();if(P.screen==='intro')return vIntro();if(P.screen==='rate')return vRate();if(P.screen==='done')return vDone();return vMerge();
}
function vSetup(){
  return '<div class="sheet"><h1>T2　心智模型問卷</h1><p class="muted">請先確認你和夥伴<b>各自用自己的裝置</b>開啟這份問卷，兩人可以同時作答。</p>'+
  '<div class="field"><label for="team">團隊代碼</label><input type="text" id="team" inputmode="numeric" autocomplete="off" placeholder="請輸入遊戲畫面上顯示的團隊代碼" value="'+esc(P.team)+'"></div>'+
  '<div class="field"><label>你在遊戲中的角色</label><div class="roles"><button class="opt'+(P.role==='A'?' sel':'')+'" data-role="A">成員 A（營運）</button><button class="opt'+(P.role==='B'?' sel':'')+'" data-role="B">成員 B（人資）</button></div></div>'+
  (P.err?'<div class="err" role="alert">'+P.err+'</div>':'')+
  '<div class="navrow"><button class="btn ghost" id="toMerge">研究者：合併兩份結果</button><button class="btn" id="toIntro">下一步</button></div></div>';
}
function vIntro(){
  return '<div class="sheet"><h2>作答說明</h2><p>遊戲暫停，接下來請<b>各自獨立</b>作答，期間不要和夥伴討論，也不要看對方的螢幕。沒有標準答案，請依照你自己對這間公司運作的理解回答。</p>'+
  '<ul><li><b>Task MM（36 題）</b>：公司運作的 9 個概念，兩兩評關聯。</li><li><b>Team Interaction MM</b>：①合作方式（15 題，6 個互動概念兩兩評關聯，請依你們剛才實際的合作過程回答）；②職能知識（14 題，知道誰負責什麼、兩邊的決策怎麼互相影響）；③決策預測（12 題，面對同一件事，你自己會怎麼做、你猜搭檔會怎麼做）。</li><li><b>作答依據（2 題）</b>：你主要是依遊戲經驗還是現實想法回答。</li><li><b>規則檢核（4 題）</b>：確認你對規則的理解。</li></ul>'+
  '<p>評分量尺是 <b>−4 到 +4</b>：負數表示一個增加時另一個傾向減少，0 表示無關，正數表示一個增加時另一個也傾向增加。數字越大，關係越強。</p><p>Task MM 的概念分成<b>決策變數</b>（薪資水準、培訓投入、加班）和<b>結果變數</b>（其餘概念）。題目若同時包含兩種，會固定問「決策變數增加時，結果變數怎麼變」。</p><p class="muted">約需 15–20 分鐘。作答到一半關掉頁面，重新開啟後可以接續。</p>'+
  '<div class="navrow"><button class="btn ghost" id="back">上一步</button><button class="btn" id="go">開始作答</button></div></div>';
}
function vRate(){
  var it=P.items[P.idx],tot=P.items.length,key=itKey(it),val=P.data[it.k][key],s=sec(it);
  P.t0=Date.now();
  var h='<div class="sheet"><div class="muted">成員 '+P.role+'　·　'+s[0]+'　第 '+(P.idx-s[1]+1)+' / '+s[2]+' 題</div><div class="bar"><i style="width:'+Math.round(P.idx/tot*100)+'%"></i></div>';
  if(it.k==='basis'||it.k==='chk'||it.k==='role'||it.k==='dep'||it.k==='scn'){
    var q,opts;
    if(it.k==='basis'){q=it.b==='task'?'剛才「公司運作的概念」那一部分，你主要是依照什麼來判斷？':'剛才「合作方式的概念」那一部分，你主要是依照什麼來判斷？';opts=it.b==='task'?['這場遊戲裡我觀察到、理解到的','我在現實生活或常識中的想法','兩者差不多']:['我們在遊戲中實際合作的方式','我平常的合作習慣，或心目中理想的合作方式','兩者差不多']}
    else if(it.k==='chk'){q=CHK[it.q].q;opts=CHK[it.q].o}
    else if(it.k==='role'){q='遊戲中，「'+LEV[it.l]+'」這項決策由誰負責？';opts=ROLES}
    else if(it.k==='dep'){q=DEP[it.q].q+'<br><span class="muted">這句話正確嗎？</span>';opts=['正確','錯誤']}
    else{var sc=SCN[it.s],mine=it.w==='own';
      q='<span class="muted">情境</span><br>'+sc.t+'<br><br>'+(mine?'換作是你，你會把你負責的<b>「'+LEV[sc[P.role]]+'」</b>怎麼調整？':'你猜，搭檔（成員 '+other(P.role)+'）會把他負責的<b>「'+LEV[sc[other(P.role)]]+'」</b>怎麼調整？');opts=DIR}
    h+='<h2>'+q+'</h2><div class="opts">'+opts.map(function(t,i){return '<button class="opt'+(val===i?' sel':'')+'" data-v="'+i+'">'+t+'</button>'}).join('')+'</div>';
  }else{
    var L=it.k==='task'?TASKC:TEAMC,mixed=it.k==='task'&&it.i<3&&it.j>=3,sw=mixed?false:!!P.swap[it.k+':'+key],a=L[sw?it.j:it.i],b=L[sw?it.i:it.j];
    function kind(idx){return it.k==='task'?(idx<3?'決策變數・':'結果變數・'):''}
    var ins=it.k==='task'?(mixed?'當決策變數<b>「'+a[0]+'」</b>增加時，結果變數<b>「'+b[0]+'」</b>傾向<b>增加還是減少</b>？請同時考慮方向與強度。':'當<b>左邊</b>的概念增加時，<b>右邊</b>的概念傾向<b>增加還是減少</b>？請同時考慮方向與強度。'):'在你們這場遊戲的合作中，當<b>左邊</b>的互動表現增加時，<b>右邊</b>的互動表現傾向<b>增加還是減少</b>？請同時考慮方向與強度。';
    var lo='強烈負向（一個增加，另一個減少）',hi='強烈正向（一個增加，另一個也增加）';
    var sc='';for(var v=-4;v<=4;v++)sc+='<button class="sc'+(val===v?' sel':'')+'" data-v="'+v+'" aria-label="'+v+'">'+(v>0?'+'+v:v)+'</button>';
    var rem=it.k==='task'?'請依照<b>這場遊戲中你觀察到、理解到的公司運作</b>回答，不是現實世界的常識。':'請依照<b>剛才在遊戲裡你們實際合作的方式</b>回答（第 1–4 回合），不是你平常的習慣，也不是你認為理想的做法。';
    h+='<p class="muted">'+rem+'</p><p>'+ins+'</p><p class="muted">請假設其他條件不變。如果你覺得這兩者在這場遊戲裡沒有關係，請選 0。</p><div class="pair"><div class="cc"><b>'+a[0]+'</b><span>'+kind(sw?it.j:it.i)+a[1]+'</span></div><div class="arrow">'+(mixed?'→':'↔')+'</div><div class="cc"><b>'+b[0]+'</b><span>'+kind(sw?it.i:it.j)+b[1]+'</span></div></div><div class="scale">'+sc+'</div><div class="ends"><span>−4　'+lo+'</span><span>0　無關</span><span>+4　'+hi+'</span></div>';
  }
  return h+'<div class="navrow"><div>'+(P.idx>0?'<button class="btn ghost" id="prev">上一題</button>':'')+'</div><button class="btn" id="next"'+(val===undefined?' disabled':'')+'>'+(P.idx===tot-1?'完成':'下一題')+'</button></div></div>';

function vDone(){
  return '<div class="sheet"><h2>作答完成，謝謝！</h2><p>請回到遊戲畫面，告訴研究者你已完成。等兩人都完成後，遊戲才會繼續。</p><p class="muted">下面這段是你的作答紀錄，請按「複製」後交給研究者（或截圖留存）。</p><textarea id="code" readonly>'+esc(P.code)+'</textarea><div><button class="btn ghost" id="copy">複製作答紀錄</button> <span class="muted" id="copied"></span></div></div>';
}
function vMerge(){
  var m=P.merge,out='';
  if(m&&m.error)out='<div class="err" role="alert">'+esc(m.error)+'</div>';
  else if(m){
    function row(n,z){return '<tr><td>'+n+'</td><td>'+(z.r==null?'—':z.r.toFixed(3))+'</td><td>'+(z.sim==null?'—':z.sim.toFixed(3))+'</td><td>'+(z.p==null?'—':z.p.toFixed(4))+'</td><td>'+z.perms.toLocaleString()+'</td></tr>'}
    out='<table><tr><th>測量</th><th>矩陣相關 r</th><th>相似度 (r+1)/2</th><th>QAP p（單尾）</th><th>排列數</th></tr>'+row('Task MM（9 概念）',m.task)+row('Team Interaction MM（6 概念）',m.team)+'</table>'+
    '<h3>Team Interaction MM：兩個要分開看的面向</h3><table><tr><th>面向</th><th>成員 A</th><th>成員 B</th><th>說明</th></tr><tr><td>職能知識：負責人（10 題）</td><td>'+m.roleA+'</td><td>'+m.roleB+'</td><td>知道「對方負責什麼」（答對題數）</td></tr><tr><td>職能知識：互相影響（4 題）</td><td>'+m.depA+'</td><td>'+m.depB+'</td><td>知道兩邊決策怎麼牽動彼此（答對題數）</td></tr><tr><td>決策預測（6 題）</td><td>'+m.predAB+'</td><td>'+m.predBA+'</td><td>A 猜 B／B 猜 A 的決策，與對方實際自己的選擇相符的題數</td></tr></table><p class="muted">「知道對方負責什麼」與「能預測對方怎麼決策」是不同能力：前者看職能知識，後者看決策預測。決策預測的隨機猜中期望值為 2 題（三選一）。</p>'+
    '<p class="muted">團隊代碼：'+esc(m.team_code)+'　規則檢核答對：A '+m.chkA+' / '+CHK.length+'，B '+m.chkB+' / '+CHK.length+'。QAP 為精確排列檢定：把一方矩陣的概念標籤做所有可能的重排，p 是排列後的 r 不低於實際 r 的比例。補充：排除 3 組「決策變數 × 決策變數」配對（33 格）的 Task MM 相關 r＝'+(m.task_noDD_r==null?'—':m.task_noDD_r.toFixed(3))+'（僅描述，不做 QAP）。準確性需要另外建立參照矩陣，這裡尚未計算。</p>';
  }
  return '<div class="sheet"><h2>研究者：合併兩份作答</h2><p class="muted">把兩位成員各自的作答紀錄貼進來，系統會計算矩陣相關、轉成 0–1 的相似度，並做 QAP 檢定。</p>'+
  '<div class="field"><label for="mA">成員 A 的作答紀錄</label><textarea id="mA"></textarea></div><div class="field"><label for="mB">成員 B 的作答紀錄</label><textarea id="mB"></textarea></div>'+out+
  '<div class="navrow"><button class="btn ghost" id="mBack">返回</button><button class="btn" id="mGo">計算</button></div></div>';
}
function bind(){
  document.querySelectorAll('[data-role]').forEach(function(el){el.onclick=function(){P.role=el.getAttribute('data-role');P.team=$('team').value;render()}});
  if($('toIntro'))$('toIntro').onclick=function(){
    P.team=$('team').value.trim();
    if(!P.team||!P.role){P.err='請輸入團隊代碼，並選擇你的角色。';render();return}
    P.err='';P.screen='intro';render();
  };
  if($('toMerge'))$('toMerge').onclick=function(){P.screen='merge';render()};
  if($('back'))$('back').onclick=function(){P.screen='setup';render()};
  if($('go'))$('go').onclick=function(){P.items=buildItems();P.idx=0;P.data={task:{},team:{},role:{},dep:{},scn:{},chk:{},basis:{}};P.rt={};P.swap={};P.items.forEach(function(it){if(it.k==='task'||it.k==='team')P.swap[it.k+':'+itKey(it)]=Math.random()<.5});P.tStart=Date.now();P.screen='rate';save();render()};
  document.querySelectorAll('.sc,.opt[data-v]').forEach(function(el){el.onclick=function(){
    var it=P.items[P.idx],v=Number(el.getAttribute('data-v')),k=itKey(it);P.data[it.k][k]=v;P.rt[it.k+':'+k]=Date.now()-P.t0;save();render();
  }});
  if($('prev'))$('prev').onclick=function(){P.idx--;save();render()};
  if($('next'))$('next').onclick=function(){
    if(P.idx<P.items.length-1){P.idx++;save();render();return}
    P.tEnd=Date.now();
    P.code=JSON.stringify({v:2,ver:'t2smm_v3',team:P.team,role:P.role,task:P.data.task,team_mm:P.data.team,role_know:P.data.role,dep:P.data.dep,scn:P.data.scn,chk:P.data.chk,basis:P.data.basis,rt:P.rt,swap:P.swap,order:P.items.map(function(x){return x.k+':'+itKey(x)}),t_start:P.tStart,t_end:P.tEnd});
    P.screen='done';save();render();
  };
  if($('copy'))$('copy').onclick=function(){var t=$('code');t.select();var ok=function(m){$('copied').textContent=m};
    try{navigator.clipboard.writeText(t.value).then(function(){ok('已複製')},function(){try{document.execCommand('copy')}catch(e){}ok('已選取，請按 Ctrl+C 複製')})}catch(e){try{document.execCommand('copy')}catch(e2){}ok('已選取，請按 Ctrl+C 複製')}};
  if($('mBack'))$('mBack').onclick=function(){P.screen='setup';render()};
  if($('mGo'))$('mGo').onclick=function(){
    var a,b;try{a=JSON.parse($('mA').value);b=JSON.parse($('mB').value)}catch(e){P.merge={error:'無法解析：請確認兩份紀錄都是完整複製的內容。'};keepMerge();return}
    if(!a||!b||a.v!==2||b.v!==2){P.merge={error:'格式不符。'};keepMerge();return}
    if(a.role===b.role){P.merge={error:'兩份紀錄的角色相同（都是 '+a.role+'）。'};keepMerge();return}
    if(a.team!==b.team){P.merge={error:'團隊代碼不一致：'+a.team+' 與 '+b.team+'。'};keepMerge();return}
    if(Object.keys(a.task).length<36||Object.keys(b.task).length<36||Object.keys(a.team_mm).length<15||Object.keys(b.team_mm).length<15||Object.keys(a.role_know||{}).length<10||Object.keys(b.role_know||{}).length<10||Object.keys(a.scn||{}).length<12||Object.keys(b.scn||{}).length<12||Object.keys(a.dep||{}).length<4||Object.keys(b.dep||{}).length<4){P.merge={error:'有紀錄未完成（題數不足）。'};keepMerge();return}
    var tx=$('mA').value,ty=$('mB').value;$('mGo').disabled=true;$('mGo').textContent='計算中…';
    setTimeout(function(){
      P.merge=mergeCalc(a,b);
      render();$('mA').value=tx;$('mB').value=ty;
    },30);
  };
}
function mergeCalc(a,b){
      var A=a.role==='A'?a:b,B=a.role==='A'?b:a;
      function sc(x){var n=0;CHK.forEach(function(c,q){if(x.chk[q]===c.a)n++});return n}
      function roleAcc(x){var n=0;Object.keys(OWN).forEach(function(l){if(x.role_know[l]===OWN[l])n++});return n}
      function depAcc(x){var n=0;DEP.forEach(function(d,q){if(x.dep['d'+q]===d.a)n++});return n}
      function pred(x,y){var n=0;SCN.forEach(function(c,i){if(x.scn[i+'-pred']===y.scn[i+'-own'])n++});return n}
      function rNoDD(){var xs=[],ys=[];pairs(9).forEach(function(p){if(p[0]<3&&p[1]<3)return;xs.push(A.task[p[0]+'-'+p[1]]);ys.push(B.task[p[0]+'-'+p[1]])});return pearson(xs,ys)}
      return {task_noDD_r:rNoDD(),team_code:a.team,task:qap(A.task,B.task,9),team:qap(A.team_mm,B.team_mm,6),chkA:sc(A),chkB:sc(B),roleA:roleAcc(A),roleB:roleAcc(B),depA:depAcc(A),depB:depAcc(B),predAB:pred(A,B),predBA:pred(B,A)};
}
function keepMerge(){var tx=$('mA').value,ty=$('mB').value;render();$('mA').value=tx;$('mB').value=ty}
function render(){$('app').innerHTML=view();bind();window.scrollTo(0,0)}
load();render();
</script>
